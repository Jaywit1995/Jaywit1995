<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SKOTECH Travels and Tours</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .success-message {
            color: #28a745;
            background-color: #d4edda;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="SKO IMG/sko logo 2.jpg" alt="SKOTECH Travels" class="auth-logo">
                <h2>Welcome Back</h2>
            </div>
            
            <!-- Success message container -->
            <div id="statusMessage"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginId">Email or Phone Number</label>
                    <input type="text" id="loginId" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-input">
                        <input type="password" id="loginPassword" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <div id="loginError" class="error-message"></div>
                </div>
                <div class="form-options">
                    <a href="forgot-password.html">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Register here</a></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password visibility toggle
            document.querySelectorAll('.toggle-password').forEach(icon => {
                icon.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    this.classList.toggle('fa-eye-slash');
                });
            });

            // Check for registration success message
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('registered')) {
                showStatusMessage('Registration successful! Please login with your credentials.', 'success');
            }

            // Login form handling
            const loginForm = document.getElementById('loginForm');
            const loginError = document.getElementById('loginError');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const loginId = document.getElementById('loginId').value.trim();
                const password = document.getElementById('loginPassword').value;
                
                // Clear previous messages
                loginError.style.display = 'none';
                
                // Validate inputs
                if (!loginId || !password) {
                    showError('Please fill in all fields');
                    return;
                }
                
                // Find user in localStorage
                let user = null;
                const isEmail = loginId.includes('@');
                
                // Search through all stored users
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.startsWith('user_')) {
                        const storedUser = JSON.parse(localStorage.getItem(key));
                        
                        // Check if login matches email or phone
                        if ((isEmail && storedUser.email === loginId) || 
                            (!isEmail && storedUser.phone === loginId)) {
                            user = storedUser;
                            break;
                        }
                    }
                }
                
                if (!user) {
                    showError('User not found. Please register first.');
                    return;
                }
                
                // Verify password
                if (user.password !== password) {
                    showError('Invalid password!');
                    return;
                }
                
                // Login successful
                showStatusMessage('Login successful! Redirecting...', 'success');
                
                // Store user session
                sessionStorage.setItem('currentUser', JSON.stringify({
                    email: user.email,
                    name: user.fullName,
                    phone: user.phone
                }));
                
                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'book-now1.html';
                }, 2000);
            });
            
            function showError(message) {
                loginError.textContent = message;
                loginError.style.display = 'block';
            }
            
            function showStatusMessage(message, type) {
                const statusDiv = document.getElementById('statusMessage');
                statusDiv.textContent = message;
                statusDiv.className = type === 'success' ? 'success-message' : 'error-message';
                statusDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
